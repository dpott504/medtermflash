<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>Med Term Cards</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#152033;--muted:#667085;--accent:#2563eb;--border:#dce3ee;--red:#b42318}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.app{max-width:760px;margin:auto;padding:18px 16px 32px}
.header{display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{font-size:30px;margin:0 0 3px}.sub{color:var(--muted);font-size:14px}
button{border:0;border-radius:12px;padding:12px 15px;font-weight:700;font-size:15px;background:#e8eef8;color:#183153;cursor:pointer}
.primary{background:var(--accent);color:white}.danger{background:#feecec;color:var(--red)}
.panel{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:15px;margin-top:15px;box-shadow:0 7px 25px #102a4308}
.tabs{display:flex;gap:7px;overflow:auto}.tab{white-space:nowrap;padding:9px 12px}.tab.active{background:#dbeafe;color:#1d4ed8}
label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin:0 0 6px}
input,select{width:100%;padding:12px;border:1px solid var(--border);border-radius:11px;background:white;font-size:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.study-card{min-height:390px;margin:16px 0;perspective:1000px;cursor:pointer}.inner{min-height:390px;position:relative;transform-style:preserve-3d;transition:.45s}.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--border);border-radius:24px;background:white;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;box-shadow:0 15px 45px #102a4310}
.back{transform:rotateY(180deg)}
.tag{font-size:12px;text-transform:uppercase;letter-spacing:.13em;color:var(--muted);font-weight:850}
.term{font-size:clamp(40px,10vw,72px);font-weight:900;margin-top:25px;word-break:break-word}
.meaning{font-size:clamp(23px,6vw,36px);font-weight:800;line-height:1.18;margin:18px 0}
.hint{color:var(--muted);margin-top:15px}
.nav{display:flex;gap:8px}.nav button{flex:1}
.stats{display:flex;justify-content:center;gap:22px;color:var(--muted);font-size:14px;margin:10px}.stats b{color:var(--ink)}
.progress{height:7px;background:#e8edf5;border-radius:99px;overflow:hidden;margin-top:8px}.progress div{height:100%;background:var(--accent);width:0}
.small{font-size:12px;color:var(--muted);text-align:center;margin-top:10px}
.modal{position:fixed;inset:0;background:#0f172a66;display:flex;align-items:flex-end;justify-content:center;padding:12px;z-index:10}
.sheet{background:white;border-radius:22px 22px 0 0;width:min(760px,100%);max-height:90vh;overflow:auto;padding:20px}.hidden{display:none!important}
.check{display:flex;gap:10px;align-items:center;padding:10px;border-bottom:1px solid #eef2f7}.check:last-child{border-bottom:0}
.check input{width:20px;height:20px}.check span{font-weight:650}
.checklist{max-height:330px;overflow:auto;border:1px solid var(--border);border-radius:12px;padding:5px}
.row{display:flex;gap:8px}.row input{flex:1}
@media(max-width:600px){.grid{grid-template-columns:1fr}.study-card,.inner{min-height:360px}}
@media(min-width:650px){.modal{align-items:center}.sheet{border-radius:22px}}
</style>

<link rel="manifest" href="./manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Med Term Cards">
<link rel="apple-touch-icon" href="./icon-192.png">

</head>
<body>
<div class="app">
  <div class="header">
    <div><h1>Med Term Cards</h1><div class="sub">Medical terminology flashcards</div></div>
    <div style="display:flex;gap:8px">
      <button class="primary" onclick="shuffleDeck()">🔀 Shuffle</button>
      <button onclick="openGroups()">Groups</button>
    </div>
  </div>

  <div class="panel">
    <div class="tabs" id="quickGroups"></div>
  </div>

  <div class="panel">
    <div class="grid">
      <div><label>Search</label><input id="search" placeholder="heart, blood, -itis..." oninput="refresh()"></div>
      <div><label>Card direction</label><select id="direction" onchange="render()"><option value="term">Element → Meaning</option><option value="meaning">Meaning → Element</option></select></div>
    </div>
    <div style="margin-top:10px">
      <label>Learning status</label>
      <select id="statusFilter" onchange="refresh()">
        <option value="all">All statuses</option>
        <option value="review">Review only</option>
        <option value="known">Known only</option>
        <option value="unmarked">Unmarked only</option>
        <option value="missed">Missed most often</option>
      </select>
    </div>
    <div style="margin-top:12px"><label>Selected groups</label><div id="selectedSummary" class="sub"></div></div>
  </div>

  <div class="panel">
    <div style="display:flex;justify-content:space-between;color:var(--muted);font-size:13px"><span id="count"></span><span id="pct"></span></div>
    <div class="progress"><div id="progress"></div></div>

    <div class="study-card" id="card" onclick="flip()">
      <div class="inner">
        <div class="face" id="front"></div>
        <div class="face back" id="back"></div>
      </div>
    </div>

    <div class="nav"><button onclick="prev()">← Previous</button><button class="primary" onclick="flip()">Flip</button><button onclick="next()">Next →</button></div>
    <div class="stats"><span>Known <b id="known">0</b></span><span>Review <b id="review">0</b></span><span>Misses <b id="misses">0</b></span></div>
    <div class="nav"><button onclick="mark(true)">✓ Knew it</button><button onclick="mark(false)">↻ Review</button></div>
    <div class="small">Progress and custom groups are saved on this device.</div>
  </div>
</div>

<div id="modal" class="modal hidden" onclick="if(event.target===this) closeGroups()">
  <div class="sheet">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h2 style="margin:0">Study Groups</h2><button onclick="closeGroups()">Done</button>
    </div>
    <p class="sub" style="margin:6px 0 16px">Select multiple groups to combine them into one study session.</p>
    <div id="groups"></div>

    <hr style="border:0;border-top:1px solid var(--border);margin:18px 0">
    <h3>Create custom group</h3>
    <div class="row"><input id="newGroup" placeholder="e.g. Cardiovascular"><button class="primary" onclick="createGroup()">Create</button></div>
    <div id="editor" style="margin-top:16px"></div>
  </div>
</div>

  localStorage.setItem("medCustomGroups",JSON.stringify(custom));
  localStorage.setItem("medSelectedGroups",JSON.stringify(selected));
  localStorage.setItem("medKnown",JSON.stringify([...known]));
  localStorage.setItem("medReview",JSON.stringify([...review]));
  localStorage.setItem("medMissCounts",JSON.stringify(missCounts));
}
function allGroups(){return {...DEFAULT_GROUPS,...custom}}
function esc(s){return s.replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")}

function refresh(){
  const q=document.getElementById("search").value.toLowerCase().trim();
  const status=document.getElementById("statusFilter")?.value||"all";
  const groups=allGroups();
  const ids=new Set();

  // Selected groups are OR'ed together; duplicates are removed.
  selected.forEach(g=>(groups[g]||[]).forEach(i=>ids.add(i)));

  deck=[...ids].filter(i=>{
    const term=CARDS[i].term;
    const statusOK=
      status==="all" ||
      (status==="review" && review.has(term)) ||
      (status==="known" && known.has(term)) ||
      (status==="unmarked" && !known.has(term) && !review.has(term)) ||
      (status==="missed" && (missCounts[term]||0)>0);
    const searchOK=!q||(CARDS[i].term+" "+CARDS[i].meaning).toLowerCase().includes(q);
    return statusOK && searchOK;
  });

  if(status==="missed"){
    deck.sort((a,b)=>(missCounts[CARDS[b].term]||0)-(missCounts[CARDS[a].term]||0));
  }

  pos=0;flipped=false;render();renderQuick();
}

function renderQuick(){
  const root=document.getElementById("quickGroups");root.innerHTML="";
  ["All cards","Likely prefixes","Likely suffixes","Roots / combining forms",...Object.keys(custom)].forEach(g=>{
    const b=document.createElement("button");
    b.className="tab"+(selected.includes(g)?" active":"");
    b.textContent=g;b.onclick=()=>toggleGroup(g);root.appendChild(b);
  });
}

function toggleGroup(g){
  if(g==="All cards"){
    selected=["All cards"];
  }else{
    selected=selected.filter(x=>x!=="All cards");
    if(selected.includes(g)) selected=selected.filter(x=>x!==g);
    else selected.push(g);
    if(!selected.length) selected=["All cards"];
  }
  save();refresh();renderGroups();
}

function render(){
  const el=document.getElementById("card");
  if(!deck.length){
    document.getElementById("front").innerHTML='<div class="tag">No cards</div><div class="meaning">Choose a group or change your search.</div>';
    document.getElementById("back").innerHTML="";
    document.getElementById("count").textContent="0 cards";
    document.getElementById("pct").textContent="";
    document.getElementById("progress").style.width="0%";
    document.getElementById("selectedSummary").textContent=selected.join(" + ")+" · 0 cards";
    return;
  }
  if(pos>=deck.length)pos=0;if(pos<0)pos=deck.length-1;
  const c=CARDS[deck[pos]],dir=document.getElementById("direction").value;
  document.getElementById("front").innerHTML=dir==="term"
    ?'<div class="tag">Medical word element</div><div class="term">'+esc(c.term)+'</div><div class="hint">Tap to reveal meaning</div>'
    :'<div class="tag">Meaning</div><div class="meaning">'+esc(c.meaning)+'</div><div class="hint">Tap to reveal element</div>';
  document.getElementById("back").innerHTML=dir==="term"
    ?'<div class="tag">Meaning</div><div class="meaning">'+esc(c.meaning)+'</div><div class="hint">'+esc(c.term)+'</div>'
    :'<div class="tag">Medical word element</div><div class="term">'+esc(c.term)+'</div>';
  el.classList.toggle("flipped",flipped);
  document.getElementById("count").textContent="Card "+(pos+1)+" of "+deck.length;
  document.getElementById("pct").textContent=Math.round((pos+1)/deck.length*100)+"%";
  document.getElementById("progress").style.width=((pos+1)/deck.length*100)+"%";
  document.getElementById("known").textContent=known.size;
  document.getElementById("review").textContent=review.size;
  document.getElementById("misses").textContent=missCounts[c.term]||0;
  document.getElementById("selectedSummary").textContent=selected.join(" + ")+" · "+deck.length+" cards shown";
}
function flip(){flipped=!flipped;render()}
function next(){pos++;flipped=false;render()}
function prev(){pos--;flipped=false;render()}
function shuffleDeck(){
 for(let i=deck.length-1;i>0;i--){
   const j=Math.floor(Math.random()*(i+1));
   [deck[i],deck[j]]=[deck[j],deck[i]];
 }
 pos=0;flipped=false;render();
}
function mark(ok){
  if(!deck.length)return;
  const t=CARDS[deck[pos]].term;

  if(ok){
    known.add(t);
    review.delete(t);
  }else{
    review.add(t);
    known.delete(t);
    missCounts[t]=(missCounts[t]||0)+1;
  }

  save();

  const status=document.getElementById("statusFilter")?.value||"all";
  if(status==="all") next();
  else refresh();
}

function openGroups(){renderGroups();const m=document.getElementById("modal");m.style.display="flex";m.classList.remove("hidden")}
function closeGroups(){const m=document.getElementById("modal");m.classList.add("hidden");m.style.display="none";refresh()}

function groupMastery(ids){
 if(!ids.length)return 0;
 let mastered=ids.filter(i=>known.has(CARDS[i].term)).length;
 return Math.round(mastered/ids.length*100);
}
function renderGroups(){
  const root=document.getElementById("groups");root.innerHTML="";
  Object.entries(allGroups()).forEach(([g,ids])=>{
    const row=document.createElement("div");row.className="check";
    row.innerHTML='<input type="checkbox" '+(selected.includes(g)?"checked":"")+'><span style="flex:1">'+esc(g)+' <small>('+ids.length+' cards · '+groupMastery(ids)+'% mastery)</small></span>'+(custom[g]?'<button class="danger">Delete</button>':'');
    row.querySelector("input").onchange=()=>toggleGroup(g);
    const del=row.querySelector("button");
    if(del)del.onclick=()=>{
      delete custom[g];
      selected=selected.filter(x=>x!==g);
      if(!selected.length)selected=["All cards"];
      if(editing===g){editing=null;document.getElementById("editor").innerHTML="";}
      save();renderGroups();refresh();
    };
    row.querySelector("span").onclick=()=>{if(custom[g])renderEditor(g)};
    root.appendChild(row);
  });
}

function createGroup(){
  const name=document.getElementById("newGroup").value.trim();
  if(!name||allGroups()[name])return;
  custom[name]=[];
  selected=selected.filter(x=>x!=="All cards");
  if(!selected.includes(name))selected.push(name);
  document.getElementById("newGroup").value="";
  save();renderGroups();renderEditor(name);refresh();
}

function renderEditor(name){
  editing=name;
  const root=document.getElementById("editor");
  root.innerHTML='<h3>Edit “'+esc(name)+'”</h3><input id="groupSearch" placeholder="Search cards to add..." oninput="renderEditorCards()"><div class="checklist" id="editorCards" style="margin-top:8px"></div>';
  renderEditorCards();
}

function renderEditorCards(){
  if(!editing)return;
  const q=document.getElementById("groupSearch").value.toLowerCase().trim();
  const set=new Set(custom[editing]||[]);
  const root=document.getElementById("editorCards");root.innerHTML="";
  CARDS.forEach((c,i)=>{
    if(q&&!((c.term+" "+c.meaning).toLowerCase().includes(q)))return;
    const row=document.createElement("label");row.className="check";
    row.innerHTML='<input type="checkbox" '+(set.has(i)?"checked":"")+'><span>'+esc(c.term)+' — '+esc(c.meaning)+'</span>';
    row.querySelector("input").onchange=e=>{
      if(e.target.checked)set.add(i);else set.delete(i);
      custom[editing]=[...set];
      save();renderGroups();refresh();
    };
    root.appendChild(row);
  });
}

document.addEventListener("keydown",e=>{
  if(e.target.matches("input,select"))return;
  if(e.key===" "){e.preventDefault();flip()}
  else if(e.key==="ArrowRight")next();
  else if(e.key==="ArrowLeft")prev();
  else if(e.key.toLowerCase()==="k")mark(true);
  else if(e.key.toLowerCase()==="r")mark(false);
});
refresh();
</script>

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(console.error);
  });
}
