<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Flashcards V4.2.1">
<title>Flashcards V4.2.1</title>
<link rel="manifest" href="./manifest.webmanifest?v=4.2.1">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="stylesheet" href="./styles.css?v=4.2.1">
</head>
<body>
<div id="studyView">
  <div class="app">
    <header class="header">
      <div><h1>Flashcards V4.2.1</h1><div class="sub">medical terms</div></div>
      <button onclick="showGroups()">Settings</button>
    </header>
    <section class="panel"><div class="tabs" id="quickGroups"></div></section>
    <section class="panel">
      <div class="grid">
        <div><label>Search</label><input id="search" placeholder="heart, blood, -itis..." oninput="buildDeck()"></div>
        <div><label>Card direction</label><select id="direction" onchange="renderCard()"><option value="term">Term → Meaning</option><option value="meaning">Meaning → Term</option></select></div>
      </div>
      <div class="field"><label>Learning status</label><select id="statusFilter" onchange="buildDeck()"><option value="all">All statuses</option><option value="review">Review only</option><option value="known">Known only</option><option value="unmarked">Unmarked only</option><option value="missed">Missed most often</option></select></div>
      <div class="field"><label>Selected groups</label><div id="selectedSummary" class="sub"></div></div>
    </section>
    <section class="panel">
      <div class="progress-head"><span id="count"></span><span id="pct"></span></div><div class="progress"><div id="progress"></div></div>
      <div class="study-card" id="card" onclick="flipCard()"><div class="inner"><div class="face" id="front"></div><div class="face back" id="back"></div></div></div>
      <div class="stats"><span>Known <b id="known">0</b></span><span>Review <b id="review">0</b></span></div>
      <div class="nav"><button onclick="markCard(true)">✓ Knew it</button><button onclick="markCard(false)">↻ Review</button></div>
      <div class="nav" style="margin-top:8px"><button onclick="prevCard()">← Previous</button><button onclick="nextCard()">Next →</button></div>
    </section>
  </div>
</div>
<div id="groupsView" class="hidden">
  <div class="app">
    <header class="header"><div><div class="sub">medical terms · V4.2.1</div><h1>Settings</h1></div><button onclick="showStudy()">← Back</button></header>
    <section class="panel"><p class="sub intro">Select any combination of groups. A card in multiple selected groups appears only once.</p><div id="groupsList"></div></section>
    <section class="panel"><h2>Create custom group</h2><div class="row"><input id="newGroup" placeholder="e.g. Cardiovascular"><button class="primary" onclick="createGroup()">Create</button></div><div id="groupEditor"></div></section>
    <section class="panel"><h2>Progress Backup</h2><p class="sub intro">Save this before clearing Safari website data or reinstalling the Home Screen app.</p><div class="backup-actions"><button class="primary" onclick="exportProgress()">Save Backup</button><button onclick="document.getElementById('progressImport').click()">Restore Backup</button></div><input id="progressImport" type="file" accept="application/json,.json" hidden onchange="importProgress(event)"></section>
  </div>
</div>
<script src="./app-v4.js?v=4.2.1"></script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(console.error)}</script>
</body>
</html>
